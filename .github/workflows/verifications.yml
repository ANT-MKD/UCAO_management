# Vérifications automatiques d'EduManage, à chaque envoi sur GitHub et à chaque demande de fusion :
# compilation, tests des calculs, construction, parcours complets dans un vrai navigateur, et tests
# de la base de données (migrations Supabase, règles d'accès, garde-fous).
# Une modification qui casse l'un d'eux est signalée avant d'arriver en production.
name: Vérifications

on:
  push:
  pull_request:

jobs:
  verifier:
    # Version fixée : « ubuntu-latest » est passé à Ubuntu 26.04, sur lequel Playwright 1.56.1
    # (la version du projet) ne sait pas installer Chromium. À relever avec Playwright.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Installer les dépendances
        run: pnpm install --frozen-lockfile

      - name: Compilation (types)
        working-directory: artifacts/edumanage
        run: pnpm run typecheck

      - name: Tests des calculs et des règles
        working-directory: artifacts/edumanage
        run: pnpm test

      - name: Construction de l'application
        working-directory: artifacts/edumanage
        run: pnpm run build

      - name: Navigateur pour les parcours
        working-directory: artifacts/edumanage
        run: pnpm exec playwright install --with-deps chromium

      - name: Parcours complets dans le navigateur
        working-directory: artifacts/edumanage
        run: pnpm run test:e2e

      - name: Rapport des parcours (en cas d'échec)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-parcours
          path: artifacts/edumanage/playwright-report
          retention-days: 7

  base-de-donnees:
    # Les migrations de supabase/migrations appliquées sur un PostgreSQL 17 (la version de Supabase)
    # avec une imitation minimale de Supabase, puis les tests de supabase/tests.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4

      - name: Migrations et tests de la base
        run: supabase/tests/lancer.sh
